<text x="28" y="66" font-family="'Courier New', Courier, monospace" font-size="16" font-weight="bold" fill="#00e5ff" text-anchor="start" letter-spacing="0" >C:\SHARVESH&gt; type ABOUT.TXT</text><text x="28" y="102" font-family="'Courier New', Courier, monospace" font-size="16" font-weight="normal" fill="#e8e0ff" text-anchor="start" letter-spacing="0" >I&#x27;m a computer science student who prefers</text><text x="28" y="126" font-family="'Courier New', Courier, monospace" font-size="16" font-weight="bold" fill="#ff2e93" text-anchor="start" letter-spacing="0" >understanding over memorizing.</text><text x="28" y="150" font-family="'Courier New', Courier, monospace" font-size="16" font-weight="normal" fill="#e8e0ff" text-anchor="start" letter-spacing="0" >I like breaking systems, fixing them, and learning</text><text x="28" y="174" font-family="'Courier New', Courier, monospace" font-size="16" font-weight="normal" fill="#e8e0ff" text-anchor="start" letter-spacing="0" >how they actually work underneath.</text><text x="28" y="210" font-family="'Courier New', Courier, monospace" font-size="16" font-weight="normal" fill="#ffe45e" text-anchor="start" letter-spacing="0" >Not rushing. Just getting better, step by step.</text><rect x="485.2" y="197" width="10" height="16" fill="#ffe45e"><animate attributeName="opacity" values="1;0" keyTimes="0;1" calcMode="discrete" dur="1s" repeatCount="indefinite"/></rect>
